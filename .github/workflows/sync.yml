name: Sync HubSpot Events to Webflow CMS

on:
  # Run twice daily at 6am and 6pm AEST (UTC+10). GitHub can start scheduled
  # runs late (sometimes by hours) when its runners are busy.
  schedule:
    - cron: '0 20 * * *'   # 6:00 AM AEST
    - cron: '0 8 * * *'    # 6:00 PM AEST

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to Webflow)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      reset:
        description: 'Reset (delete ALL items, then rebuild)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

# Never let a manual run and a scheduled run write to Webflow at the same time.
concurrency:
  group: hubspot-webflow-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: secrets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run tests
        run: npm test

      - name: Run sync
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          WEBFLOW_SITE_ID: ${{ secrets.WEBFLOW_SITE_ID }}
          EVENTS_COLLECTION_ID: ${{ secrets.EVENTS_COLLECTION_ID }}
          SPEAKERS_COLLECTION_ID: ${{ secrets.SPEAKERS_COLLECTION_ID }}
          SPONSORS_COLLECTION_ID: ${{ secrets.SPONSORS_COLLECTION_ID }}
          AGENDAS_COLLECTION_ID: ${{ secrets.AGENDAS_COLLECTION_ID }}
          HUBSPOT_PROXY_BASE_URL: ${{ secrets.HUBSPOT_PROXY_BASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          RESET: ${{ github.event.inputs.reset || 'false' }}
        run: npm run sync
